# ==============================================================================
# Configuração de Proxy Reverso Nginx para IANE - Gestão de Dispositivos
# Servidor: On-Premise IANE Indústria e Comércio
# ==============================================================================

# ------------------------------------------------------------------------------
# Rate limiting: protege o endpoint de login contra força bruta.
# Limita a 5 requisições por minuto por IP para /api/auth/login.
# ------------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# ------------------------------------------------------------------------------
# Servidor HTTP (80) -> redireciona para HTTPS (443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name telefonia.iane.ind.br; # Substitua pelo seu domínio ou IP interno

    # Redireciona todo tráfego HTTP para HTTPS
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# Servidor HTTPS (443)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name telefonia.iane.ind.br; # Substitua pelo seu domínio ou IP interno

    # --- Certificados SSL/TLS (obtidos via Certbot ou CA interna) ---
    ssl_certificate     /etc/letsencrypt/live/telefonia.iane.ind.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telefonia.iane.ind.br/privkey.pem;

    # --- Versões e cifras TLS ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Hardening de headers de segurança ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Limite de corpo da requisição (ex.: upload de PDF de termo) ---
    client_max_body_size 50m;

    # --- Logs ---
    access_log /var/log/nginx/iane_access.log;
    error_log  /var/log/nginx/iane_error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts para operações de importação de planilhas e relatórios
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Rate limiting apenas no endpoint de login
        limit_req zone=login_limit burst=10 nodelay;
    }
}
