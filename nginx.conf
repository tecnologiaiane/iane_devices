# ==============================================================================
# Configuração de Proxy Reverso Nginx para TelecomAsset Pro
# Servidor: On-Premise IANE Indústria e Comércio
# ==============================================================================

# Redirecionamento HTTP para HTTPS (Recomendado em Produção)
server {
    listen 80;
    listen [::]:80;
    server_name telefonia.iane.ind.br; # Substitua pelo seu domínio ou IP interno

    # Se você já utiliza Certbot / SSL:
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts para operações de importação de planilhas e relatórios
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

