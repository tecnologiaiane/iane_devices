services:
  # ----------------------------------------------------------------------------
  # 1. Banco de Dados Relacional PostgreSQL
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: telecom_postgres
    restart: always
    environment:
      POSTGRES_DB: telecom_assets
      POSTGRES_USER: iane_admin
      # Obrigatória: defina POSTGRES_PASSWORD no .env (sem valor padrão inseguro).
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}"
      # Senha do usuário de aplicação (iane_app). Obrigatória em produção.
      IANE_APP_PASSWORD: "${IANE_APP_PASSWORD:?Defina IANE_APP_PASSWORD no arquivo .env}"
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ./docker-entrypoint-initdb.d/02-app-user.sh:/docker-entrypoint-initdb.d/02-app-user.sh:ro
    ports:
      # Por padrão, publicada apenas na interface local. Para acesso remoto,
      # defina POSTGRES_BIND_IP no .env e restrinja a porta 5432 no firewall.
      - "${POSTGRES_BIND_IP:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iane_admin -d telecom_assets"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telecom_net

  # ----------------------------------------------------------------------------
  # 2. Aplicação Web IANE - Gestão de Dispositivos (Backend Express + Frontend React)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telecom_app
    restart: always
    user: node
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-America/Sao_Paulo}
      # Obrigatórios: o compose recusa iniciar sem estes valores definidos no .env.
      JWT_SECRET: "${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (ex.: openssl rand -hex 48)}"
      # Validade da sessão (padrão 12h). Ex.: 8h, 12h, 1d.
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      # Usuário de aplicação (princípio do menor privilégio). iane_admin é usado
      # apenas para administração; o app se conecta como iane_app.
      DATABASE_URL: "${DATABASE_URL:?Defina DATABASE_URL no arquivo .env}"
      # Conexão administrativa usada apenas pela automigração (DDL). O app roda
      # as consultas do dia a dia como iane_app (menor privilégio). Por padrão é
      # montada com POSTGRES_PASSWORD; pode ser sobrescrita no .env.
      DATABASE_ADMIN_URL: "${DATABASE_ADMIN_URL:-postgresql://iane_admin:${POSTGRES_PASSWORD}@postgres:5432/telecom_assets}"
      # Em produção, NUNCA habilite o modo memória: ele não persiste dados.
      ALLOW_MEMORY_FALLBACK: ${ALLOW_MEMORY_FALLBACK:-false}
      # Backup automático: intervalo em horas, cópias mantidas e pasta persistida no host.
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_DIR: /app/backups
    ports:
      # Publicada apenas na interface local. Para acesso externo, use túnel SSH ou reverse proxy.
      - "127.0.0.1:3000:3000"
    volumes:
      # Mantém as cópias de segurança fora do container (sobrevivem a rebuilds).
      - ./backups:/app/backups
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: '0.5'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telecom_net

volumes:
  postgres_data:
    driver: local

networks:
  telecom_net:
    driver: bridge
