services:
  # ----------------------------------------------------------------------------
  # 1. Banco de Dados Relacional PostgreSQL
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: telecom_postgres
    restart: always
    environment:
      POSTGRES_DB: telecom_assets
      POSTGRES_USER: iane_admin
      # Defina POSTGRES_PASSWORD e DATABASE_URL no arquivo .env para produção.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Iane@admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      # Acesso para administração na rede local (pgAdmin, DBeaver)
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iane_admin -d telecom_assets"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telecom_net

  # ----------------------------------------------------------------------------
  # 2. Aplicação Web IANE - Gestão de Dispositivos (Backend Express + Frontend React)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telecom_app
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      # Defina JWT_SECRET no .env com um valor longo e aleatório (ex.: openssl rand -hex 48).
      # Sem ele o servidor gera um segredo efêmero e as sessões caem a cada reinício.
      JWT_SECRET: ${JWT_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://iane_admin:Iane%40admin@postgres:5432/telecom_assets}
      # Backup automático: intervalo em horas, cópias mantidas e pasta persistida no host.
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_DIR: /app/backups
    ports:
      # Acesso web via rede local ou externa
      - "3000:3000"
    volumes:
      # Mantém as cópias de segurança fora do container (sobrevivem a rebuilds)
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telecom_net

volumes:
  postgres_data:
    driver: local

networks:
  telecom_net:
    driver: bridge
